name: Verificar botão sair e lembrar usuário
on:
  push:
    branches: [previa-sair-lembrar-usuario]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos
        run: npm run lint
      - name: Compilar
        run: npm run build
